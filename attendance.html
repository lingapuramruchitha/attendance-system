<!DOCTYPE html>
<html>
<head>
    <title>Attendance Records</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
            padding:30px;
        }

        h2{
            text-align:center;
        }

        table{
            width:95%;
            margin:auto;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid black;
            padding:12px;
            text-align:center;
        }

        th{
            background:#007bff;
            color:white;
        }

        a{
            text-decoration:none;
            padding:10px 20px;
            background:#28a745;
            color:white;
            border-radius:5px;
        }

        .back{
            text-align:center;
            margin-top:20px;
        }

    </style>
</head>

<body>

<h2>Attendance Records</h2>

<table>

<tr>
<th>ID</th>
<th>Roll No</th>
<th>Name</th>
<th>Department</th>
<th>Date</th>
<th>Time</th>
<th>Status</th>
</tr>

{% for row in attendance %}

<tr>

<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
<td>{{ row[4] }}</td>
<td>{{ row[5] }}</td>
<td>{{ row[6] }}</td>

</tr>

{% endfor %}

</table>

<div class="back">
    <a href="/dashboard">Back to Dashboard</a>
</div>

</body>
</html>
